name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  verify:
    name: Check, test, and build
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit

      - name: Check text encoding
        run: npm run check:mojibake

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Optional live health smoke
        if: ${{ env.APP_BASE_URL != '' }}
        run: npm run smoke:health
